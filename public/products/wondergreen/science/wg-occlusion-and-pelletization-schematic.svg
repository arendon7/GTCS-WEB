<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Cómo se relacionan la matriz organomineral y el peletizado</title>
  <desc id="desc">Esquema conceptual: componentes orgánicos y minerales se integran dentro de una matriz organomineral; el producto sólido tiene forma peletizada. No representa dimensiones, distribución exacta ni una micrografía de un producto Wondergreen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f9f4"/><stop offset="1" stop-color="#edf3eb"/></linearGradient>
    <linearGradient id="matrix" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2d22"/><stop offset="1" stop-color="#006b45"/></linearGradient>
    <pattern id="mineral" width="56" height="48" patternUnits="userSpaceOnUse"><path d="M12 4 22 10 22 22 12 28 2 22 2 10Z" fill="#f4d944"/><circle cx="42" cy="34" r="5" fill="#bbf451"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b2d22" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#789186"/></marker>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="88" y="112" fill="#006b45" font-family="Avenir Next, Avenir, sans-serif" font-size="20" font-weight="700" letter-spacing="3">LECTURA DE LA FORMA Y LA MATRIZ</text>
  <text x="88" y="188" fill="#0b1813" font-family="Avenir Next, Avenir, sans-serif" font-size="52" font-weight="700" letter-spacing="-2">Peletizado describe la forma.</text>
  <text x="88" y="250" fill="#0b1813" font-family="Avenir Next, Avenir, sans-serif" font-size="52" font-weight="700" letter-spacing="-2">Oclusión describe la formulación.</text>
  <text x="90" y="300" fill="#4e6358" font-family="Avenir Next, Avenir, sans-serif" font-size="22">Los componentes minerales se integran dentro de la matriz organomineral.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="378" width="350" height="284" rx="24" fill="#fff"/>
    <rect x="88" y="378" width="350" height="8" rx="4" fill="#986d42"/>
    <text x="122" y="438" fill="#0b1813" font-family="Avenir Next, Avenir, sans-serif" font-size="25" font-weight="700">Fracción orgánica</text>
    <path d="M130 500c35-28 57 28 91 0s58 28 92 0 54 21 79-2" fill="none" stroke="#986d42" stroke-width="12" stroke-linecap="round"/>
    <path d="M130 535c32-24 53 23 86 0s57 24 89 0 54 18 82-2" fill="none" stroke="#c9a06d" stroke-width="8" stroke-linecap="round"/>
    <text x="122" y="600" fill="#52665a" font-family="Avenir Next, Avenir, sans-serif" font-size="18">Parte de la matriz del sólido.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="88" y="690" width="350" height="108" rx="18" fill="#fff"/>
    <path d="M128 733h34v34h-34z" fill="#f4d944"/><path d="M178 733h34v34h-34z" fill="#bbf451"/>
    <circle cx="247" cy="750" r="17" fill="#d4a243"/><circle cx="292" cy="750" r="17" fill="#e7c25b"/>
    <text x="330" y="747" fill="#0b1813" font-family="Avenir Next, Avenir, sans-serif" font-size="20" font-weight="700">Componentes</text>
    <text x="330" y="774" fill="#4e6358" font-family="Avenir Next, Avenir, sans-serif" font-size="18">minerales</text>
  </g>

  <path d="M460 520H580" stroke="#789186" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M460 744c75 0 75-117 120-117" fill="none" stroke="#789186" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="610" y="408" width="442" height="306" rx="26" fill="url(#matrix)"/>
    <rect x="642" y="442" width="378" height="188" rx="18" fill="url(#mineral)" opacity=".95"/>
    <text x="644" y="674" fill="#fff" font-family="Avenir Next, Avenir, sans-serif" font-size="25" font-weight="700">Matriz organomineral</text>
    <text x="644" y="703" fill="#d7e7db" font-family="Avenir Next, Avenir, sans-serif" font-size="17">Componentes integrados en el sólido</text>
  </g>
  <path d="M1070 560H1184" stroke="#789186" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1210" y="408" width="302" height="306" rx="26" fill="#fff"/>
    <circle cx="1361" cy="510" r="51" fill="#e3e9db"/>
    <path d="M1320 519c11-33 36-48 75-35 18 6 32 24 27 40-5 18-33 30-63 27-27-2-48-13-39-32Z" fill="#986d42"/>
    <circle cx="1343" cy="505" r="5" fill="#f4d944"/><circle cx="1360" cy="493" r="4" fill="#bbf451"/><circle cx="1378" cy="504" r="6" fill="#f4d944"/><circle cx="1349" cy="524" r="4" fill="#bbf451"/><circle cx="1370" cy="530" r="5" fill="#f4d944"/><circle cx="1384" cy="521" r="3.5" fill="#bbf451"/>
    <text x="1242" y="608" fill="#0b1813" font-family="Avenir Next, Avenir, sans-serif" font-size="24" font-weight="700">Sólido peletizado</text>
    <text x="1242" y="644" fill="#4e6358" font-family="Avenir Next, Avenir, sans-serif" font-size="17">Forma física del producto</text>
    <text x="1242" y="674" fill="#4e6358" font-family="Avenir Next, Avenir, sans-serif" font-size="17">según su referencia.</text>
  </g>
  <text x="88" y="850" fill="#65796d" font-family="Avenir Next, Avenir, sans-serif" font-size="16">Esquema conceptual · sin escala · no es micrografía ni representación geométrica de un SKU Wondergreen.</text>
</svg>
