<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="graphic-title graphic-description">
  <title id="graphic-title">De la corriente a una decisión</title>
  <desc id="graphic-description">Diagrama del método de Agroindustria y proyectos productivos de Greenatics. Parte de una corriente, un sitio y un periodo; caracteriza cantidad, calidad, variación, logística, manejo actual y salida posible; compara qué dato completar y qué alternativa comparar; y permite decidir, bajo criterios, avanzar, ajustar o detener antes de comprometer inversión.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf6"/>
      <stop offset="1" stop-color="#f1f6ed"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3327"/>
      <stop offset="1" stop-color="#0b563b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#71934b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.3px; fill: #597451; }
      .title { font-size: 44px; font-weight: 700; letter-spacing: -1.4px; fill: #0a3327; }
      .intro { font-size: 19px; font-weight: 400; fill: #526456; }
      .step { font-size: 15px; font-weight: 700; letter-spacing: 1.7px; fill: #0a3327; }
      .head { font-size: 24px; font-weight: 700; letter-spacing: -.4px; fill: #0a3327; }
      .body { font-size: 17px; font-weight: 500; fill: #34483a; }
      .chip { font-size: 15px; font-weight: 600; fill: #24452e; }
      .small { font-size: 14px; font-weight: 500; fill: #617163; }
      .outcome { font-size: 19px; font-weight: 700; fill: #0a3327; }
    </style>
  </defs>
  <rect width="1440" height="820" rx="32" fill="url(#field)"/>
  <path d="M0 0h1440v12H0z" fill="#98cf4f"/>

  <text x="72" y="73" class="eyebrow">AGROINDUSTRIA Y PROYECTOS PRODUCTIVOS</text>
  <text x="72" y="132" class="title">De la corriente a una decisión</text>
  <text x="72" y="174" class="intro">Evaluar el proceso antes de comprometer inversión.</text>
  <path d="M72 212H1368" stroke="#dce6d7" stroke-width="1.5"/>

  <!-- Scope: the assessed unit is a current, site and period. -->
  <g>
    <circle cx="92" cy="270" r="17" fill="#d8ed9c"/>
    <text x="92" y="275" text-anchor="middle" class="step" fill="#0a3327">01</text>
    <text x="72" y="316" class="head">Delimitar</text>
    <text x="72" y="349" class="body">La evaluación parte de:</text>
    <rect x="72" y="374" width="250" height="48" rx="24" fill="#e6efdd"/>
    <circle cx="96" cy="398" r="5" fill="#71934b"/>
    <text x="112" y="404" class="chip">Una corriente</text>
    <rect x="72" y="434" width="250" height="48" rx="24" fill="#e6efdd"/>
    <circle cx="96" cy="458" r="5" fill="#71934b"/>
    <text x="112" y="464" class="chip">Un sitio</text>
    <rect x="72" y="494" width="250" height="48" rx="24" fill="#e6efdd"/>
    <circle cx="96" cy="518" r="5" fill="#71934b"/>
    <text x="112" y="524" class="chip">Un periodo</text>
  </g>

  <!-- Characterization: six source-backed dimensions converge. -->
  <g>
    <circle cx="390" cy="270" r="17" fill="#d8ed9c"/>
    <text x="390" y="275" text-anchor="middle" class="step" fill="#0a3327">02</text>
    <text x="370" y="316" class="head">Caracterizar</text>
    <text x="370" y="349" class="body">Entender qué material tienes</text>
    <text x="370" y="374" class="body">y cómo se produce.</text>
    <rect x="370" y="397" width="150" height="44" rx="12" fill="#ffffff" stroke="#dce6d7"/>
    <text x="445" y="425" text-anchor="middle" class="chip">Cantidad</text>
    <rect x="530" y="397" width="150" height="44" rx="12" fill="#ffffff" stroke="#dce6d7"/>
    <text x="605" y="425" text-anchor="middle" class="chip">Calidad</text>
    <rect x="370" y="453" width="150" height="44" rx="12" fill="#ffffff" stroke="#dce6d7"/>
    <text x="445" y="481" text-anchor="middle" class="chip">Variación</text>
    <rect x="530" y="453" width="150" height="44" rx="12" fill="#ffffff" stroke="#dce6d7"/>
    <text x="605" y="481" text-anchor="middle" class="chip">Logística</text>
    <rect x="370" y="509" width="150" height="44" rx="12" fill="#ffffff" stroke="#dce6d7"/>
    <text x="445" y="537" text-anchor="middle" class="chip">Manejo actual</text>
    <rect x="530" y="509" width="150" height="44" rx="12" fill="#ffffff" stroke="#dce6d7"/>
    <text x="605" y="537" text-anchor="middle" class="chip">Salida posible</text>
  </g>

  <!-- Connect the first two work stages. -->
  <path d="M322 458H352" stroke="#71934b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Compare alternatives, without asserting a ranking or a result. -->
  <g>
    <circle cx="748" cy="270" r="17" fill="#d8ed9c"/>
    <text x="748" y="275" text-anchor="middle" class="step" fill="#0a3327">03</text>
    <text x="728" y="316" class="head">Comparar alternativas</text>
    <text x="728" y="349" class="body">La caracterización ayuda a ordenar:</text>
    <path d="M744 392v124" stroke="#bdd09f" stroke-width="2"/>
    <circle cx="744" cy="410" r="8" fill="#98cf4f"/>
    <circle cx="744" cy="492" r="8" fill="#98cf4f"/>
    <rect x="766" y="384" width="267" height="54" rx="14" fill="#e8f0df"/>
    <text x="789" y="418" class="body">Qué dato completar</text>
    <rect x="766" y="466" width="267" height="54" rx="14" fill="#e8f0df"/>
    <text x="789" y="500" class="body">Qué alternativa comparar</text>
  </g>

  <path d="M680 458H710" stroke="#71934b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1033 458H1060" stroke="#71934b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Criteria are the decision gate; outcomes remain conditional and equal. -->
  <g>
    <circle cx="1090" cy="270" r="17" fill="#d8ed9c"/>
    <text x="1090" y="275" text-anchor="middle" class="step" fill="#0a3327">04</text>
    <text x="1070" y="316" class="head">Decidir</text>
    <text x="1070" y="349" class="body">Bajo criterios definidos</text>
    <path d="M1090 402 1119 431 1090 460 1061 431Z" fill="url(#focus)"/>
    <text x="1090" y="436" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">CRITERIOS</text>
    <path d="M1119 431h29v-50h24M1148 431h24M1148 431v50h24" fill="none" stroke="#71934b" stroke-width="2"/>
    <rect x="1172" y="356" width="196" height="48" rx="24" fill="#e4efda"/>
    <circle cx="1197" cy="380" r="6" fill="#5c8b42"/>
    <text x="1215" y="387" class="outcome">Avanzar</text>
    <rect x="1172" y="407" width="196" height="48" rx="24" fill="#edf1d8"/>
    <circle cx="1197" cy="431" r="6" fill="#8da33e"/>
    <text x="1215" y="438" class="outcome">Ajustar</text>
    <rect x="1172" y="458" width="196" height="48" rx="24" fill="#f0eee3"/>
    <circle cx="1197" cy="482" r="6" fill="#8a8773"/>
    <text x="1215" y="489" class="outcome">Detener</text>
  </g>

  <path d="M72 625H1368" stroke="#dce6d7" stroke-width="1.5"/>
  <circle cx="84" cy="676" r="7" fill="#98cf4f"/>
  <text x="105" y="683" font-size="18" font-weight="700" fill="#0a3327">Antes de comprometer inversión.</text>
</svg>
