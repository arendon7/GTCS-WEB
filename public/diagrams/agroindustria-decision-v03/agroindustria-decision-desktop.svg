<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">De una corriente a una decisión</title>
<desc id="desc">Diagrama conceptual para agroindustria: delimitar una corriente, sitio y periodo; definir el muestreo para caracterizar; revisar seis variables y comparar qué dato completar y qué alternativa estudiar; decidir bajo criterios definidos si avanzar, ajustar o detener.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcf9"/><stop offset="1" stop-color="#edf3eb"/></linearGradient>
  <linearGradient id="fiber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#386d4b"/><stop offset=".52" stop-color="#98cf4f"/><stop offset="1" stop-color="#cbdcae"/></linearGradient>
  <linearGradient id="sample" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe9d3"/><stop offset="1" stop-color="#aac77e"/></linearGradient>
  <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1.2" fill="#7b9a63" opacity=".22"/><circle cx="14" cy="12" r=".8" fill="#173b2d" opacity=".12"/><path d="M1 17l5-2" stroke="#7b9a63" stroke-width=".7" opacity=".2"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1l6 3-6 3" fill="none" stroke="#698a4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    text{font-family:"Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .eyebrow{font-size:13px;font-weight:800;letter-spacing:2px;fill:#547452}
    .title{font-size:34px;font-weight:750;letter-spacing:-1.1px;fill:#0a3327}
    .deck{font-size:16px;font-weight:500;fill:#4e6358}
    .step{font-size:13px;font-weight:800;letter-spacing:1.25px;fill:#0a3327}
    .num{font-size:11px;font-weight:800;fill:#fff}
    .body{font-size:15px;font-weight:600;fill:#173b2d}
    .small{font-size:12px;font-weight:550;fill:#53685b}
    .variable{font-size:14px;font-weight:700;fill:#173b2d}
    .outcome{font-size:17px;font-weight:800;fill:#0a3327}
    .micro{font-size:10px;font-weight:800;letter-spacing:1.4px;fill:#5a7555}
    .rule{stroke:#cad8c6;stroke-width:1.3;fill:none}
    .flow{stroke:#739754;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1440" height="980" rx="24" fill="url(#paper)"/>
<path d="M0 0h1440v8H0z" fill="#98cf4f"/>
<text x="58" y="56" class="eyebrow">AGROINDUSTRIA · MÉTODO DE EVALUACIÓN</text>
<text x="58" y="108" class="title">De una corriente a una decisión</text>
<text x="58" y="139" class="deck">Un sitio y un periodo ordenan qué conocer, qué comparar y cómo avanzar.</text>
<text x="1382" y="56" class="micro" text-anchor="end">ESQUEMA CONCEPTUAL</text>

<!-- Un solo recorrido estructural, no títulos colocados sobre una fotografía. -->
<path d="M76 190H1362" class="rule"/>
<g><circle cx="82" cy="190" r="13" fill="#0a3327"/><text x="82" y="194" text-anchor="middle" class="num">01</text><text x="105" y="195" class="step">DELIMITAR</text></g>
<g><circle cx="372" cy="190" r="13" fill="#0a3327"/><text x="372" y="194" text-anchor="middle" class="num">02</text><text x="395" y="195" class="step">CARACTERIZAR</text></g>
<g><circle cx="692" cy="190" r="13" fill="#0a3327"/><text x="692" y="194" text-anchor="middle" class="num">03</text><text x="715" y="195" class="step">COMPARAR</text></g>
<g><circle cx="1095" cy="190" r="13" fill="#0a3327"/><text x="1095" y="194" text-anchor="middle" class="num">04</text><text x="1118" y="195" class="step">DECIDIR</text></g>

<!-- Corriente conceptual construida como hebras materiales que converge en el muestreo. -->
<g aria-label="Representación conceptual de una corriente">
  <path d="M72 346C145 294 208 307 288 343S350 364 408 364" stroke="url(#fiber)" stroke-width="24" opacity=".18" fill="none" stroke-linecap="round"/>
  <path d="M68 358C145 316 206 326 282 357S345 376 410 376" stroke="#4d7951" stroke-width="5" opacity=".78" fill="none" stroke-linecap="round"/>
  <path d="M73 374C148 338 206 342 281 370S349 389 410 388" stroke="#a2c56f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M78 389C149 360 209 360 283 384S350 400 410 400" stroke="#6f8f5c" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M89 330c18-12 30-8 40 1m17-11c12-6 23-4 30 4m19-3c14-4 24 0 33 8m-111 44c10-3 19-1 28 5m38 5c12-2 21 1 28 7m41-16c13 0 21 3 31 10" stroke="#315f40" stroke-width="2" fill="none" stroke-linecap="round" opacity=".75"/>
  <g fill="#98cf4f" opacity=".9"><ellipse cx="110" cy="405" rx="8" ry="3" transform="rotate(-23 110 405)"/><ellipse cx="164" cy="307" rx="9" ry="3" transform="rotate(12 164 307)"/><ellipse cx="234" cy="409" rx="7" ry="3" transform="rotate(-12 234 409)"/><ellipse cx="302" cy="321" rx="7" ry="3" transform="rotate(18 302 321)"/><ellipse cx="344" cy="411" rx="8" ry="3" transform="rotate(-9 344 411)"/></g>
  <path d="M78 428h286" class="rule" marker-end="url(#arrow)"/>
  <text x="78" y="464" class="body">Una corriente · un sitio · un periodo</text>
  <text x="78" y="488" class="small">Proceso · temporada · manejo.</text>
</g>

<!-- La muestra es un detalle diagramático conectado al flujo, no una tecnología afirmada. -->
<g aria-label="Muestreo definido para la decisión">
  <path d="M420 374C451 374 463 366 484 366" class="flow" marker-end="url(#arrow)"/>
  <path d="M508 330h125l-12 91q-2 16-17 16h-67q-15 0-17-16z" fill="#f7faf3" stroke="#718f5b" stroke-width="2"/>
  <path d="M514 382c17-7 26-2 38-7s20 1 31-5 22-4 38 0l-4 45q-2 13-14 13h-65q-12 0-14-13z" fill="url(#sample)"/>
  <path d="M514 382c17-7 26-2 38-7s20 1 31-5 22-4 38 0" fill="none" stroke="#66834e" stroke-width="2"/>
  <path d="M529 394l11-7m5 20 13-10m8 5 9-8m7 17 15-10m-55-2 6-4" stroke="#55724a" stroke-width="2" stroke-linecap="round" opacity=".72"/>
  <circle cx="570" cy="365" r="57" fill="none" stroke="#9db884" stroke-width="1.3" stroke-dasharray="2 7"/>
  <path d="M510 471h118" class="rule" marker-end="url(#arrow)"/>
  <text x="570" y="493" text-anchor="middle" class="body">Muestreo</text>
  <text x="570" y="516" text-anchor="middle" class="body">definido</text>
  <text x="570" y="541" text-anchor="middle" class="small">para la decisión</text>
  <text x="570" y="558" text-anchor="middle" class="small">que necesitas tomar.</text>
</g>

<!-- Variables neutrales; ningún tamaño o trazo expresa magnitud o puntaje. -->
<g aria-label="Variables de caracterización">
  <path d="M670 238v333" stroke="#cad8c6" stroke-width="1.2"/>
  <text x="702" y="252" class="micro">SEIS DIMENSIONES DE LECTURA</text>
  <path d="M702 277H1046M702 346H1046M702 415H1046M702 484H1046M874 277v207" class="rule"/>
  <g transform="translate(714 302)"><circle cx="8" cy="0" r="6" fill="#98cf4f"/><path d="M8-11V11M-3 0H19" stroke="#426b46" stroke-width="1.4"/><text x="29" y="5" class="variable">Cantidad</text></g>
  <g transform="translate(888 302)"><path d="M0 5l7-10 7 10z" fill="#dce9c9" stroke="#66834e" stroke-width="1.2"/><circle cx="7" cy="1" r="2" fill="#98cf4f"/><text x="24" y="5" class="variable">Calidad</text></g>
  <g transform="translate(714 371)"><path d="M0 0h17M4-7v14m6-14v14" stroke="#66834e" stroke-width="1.4"/><circle cx="4" cy="0" r="3" fill="#98cf4f"/><text x="29" y="5" class="variable">Variación</text></g>
  <g transform="translate(888 371)"><path d="M0-6h16M0 0h10M0 6h16" stroke="#66834e" stroke-width="1.5"/><circle cx="4" cy="-6" r="2" fill="#98cf4f"/><circle cx="12" cy="6" r="2" fill="#98cf4f"/><text x="24" y="5" class="variable">Logística</text></g>
  <g transform="translate(714 440)"><path d="M1 7c1-12 15-16 17-3M3 8h14" stroke="#66834e" stroke-width="1.5" fill="none"/><circle cx="10" cy="-2" r="3" fill="#98cf4f"/><text x="29" y="5" class="variable">Manejo actual</text></g>
  <g transform="translate(888 440)"><path d="M0 0h17m-6-6 6 6-6 6" stroke="#66834e" stroke-width="1.5" fill="none"/><text x="24" y="5" class="variable">Salida posible</text></g>
  <text x="702" y="525" class="small">Composición · proceso · temporada · manejo</text>
  <path d="M632 383h56" class="flow" marker-end="url(#arrow)"/>
  <path d="M1048 383h42" class="flow" marker-end="url(#arrow)"/>
</g>

<!-- Comparación de información y rutas; no implica selección automática. -->
<g aria-label="Comparar información y alternativas">
  <text x="702" y="602" class="micro">PREGUNTAS QUE ORDENA LA EVALUACIÓN</text>
  <path d="M702 620H1046" class="rule"/>
  <circle cx="714" cy="649" r="4" fill="#98cf4f"/><text x="730" y="654" class="small">¿Qué dato falta completar?</text>
  <circle cx="714" cy="680" r="4" fill="#98cf4f"/><text x="730" y="685" class="small">¿Qué alternativa vale la pena comparar?</text>
</g>

<!-- Tres salidas visualmente equivalentes, sin semáforo, orden de preferencia o probabilidad. -->
<g aria-label="Salidas sujetas a criterios definidos">
  <text x="1094" y="252" class="micro">BAJO CRITERIOS DEFINIDOS</text>
  <path d="M1092 383h42M1134 383c32 0 29-70 66-70h17M1134 383h83M1134 383c32 0 29 70 66 70h17" class="flow"/>
  <circle cx="1134" cy="383" r="6" fill="#98cf4f" stroke="#426b46" stroke-width="1.5"/>
  <path d="M1218 313h29M1218 383h29M1218 453h29" class="flow" marker-end="url(#arrow)"/>
  <circle cx="1263" cy="313" r="15" fill="#e4edda" stroke="#77965b" stroke-width="1.3"/><circle cx="1263" cy="313" r="4" fill="#98cf4f"/>
  <circle cx="1263" cy="383" r="15" fill="#e4edda" stroke="#77965b" stroke-width="1.3"/><circle cx="1263" cy="383" r="4" fill="#98cf4f"/>
  <circle cx="1263" cy="453" r="15" fill="#e4edda" stroke="#77965b" stroke-width="1.3"/><circle cx="1263" cy="453" r="4" fill="#98cf4f"/>
  <text x="1290" y="319" class="outcome">Avanzar</text><text x="1290" y="389" class="outcome">Ajustar</text><text x="1290" y="459" class="outcome">Detener</text>
  <text x="1218" y="510" class="small">La decisión precede</text><text x="1218" y="531" class="small">a comprometer inversión.</text>
</g>

<!-- La corriente atraviesa las cuatro fases y se convierte en una lógica legible. -->
<path d="M50 738H1390" class="rule"/>
<text x="58" y="780" class="eyebrow">LA INFORMACIÓN ORDENA LA DECISIÓN</text>
<text x="58" y="818" class="title" font-size="27">Ordena la información para decidir con criterio.</text>
<g transform="translate(60 864)"><path d="M0 0h192" class="flow" marker-end="url(#arrow)"/><text x="0" y="30" class="small">Caracterizar</text><text x="252" y="30" class="small">Comparar</text><text x="465" y="30" class="small">Decidir</text><text x="750" y="30" class="small">Avanzar · ajustar · detener</text></g>
<text x="1382" y="945" class="micro" text-anchor="end">GREENATICS · AGROINDUSTRIA</text>
</svg>
