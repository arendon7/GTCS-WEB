  <g font-family="Arial,sans-serif" font-size="18" fill="#d8e5dc"><text x="84" y="204">Organizaciones</text><text x="84" y="258">Generadores</text><text x="84" y="312">Cobertura</text><text x="84" y="366">Trabajo de campo</text><text x="84" y="420">Hallazgos</text><text x="84" y="474">Acciones y seguimiento</text></g>
