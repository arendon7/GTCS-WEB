<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Acceso por organización, entorno y responsabilidad</title>
  <desc id="desc">Relación entre organización, entorno, aplicación, rol y permiso para definir qué puede consultar o hacer cada persona.</desc>
  <rect width="1440" height="900" fill="#eef3ec"/>
  <rect x="48" y="48" width="1344" height="804" rx="28" fill="#fff" stroke="#cbd8ce" stroke-width="2"/>
  <text x="96" y="120" fill="#16764f" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.7">ORGANIZACIÓN · ENTORNO · PERMISOS</text>
  <text x="96" y="194" fill="#10392c" font-family="Arial,sans-serif" font-size="44" font-weight="700">El permiso sigue al contexto de trabajo</text>
  <text x="96" y="238" fill="#5f7268" font-family="Arial,sans-serif" font-size="21">Una cuenta no debe mezclar organizaciones, entornos ni responsabilidades.</text>
  <g>
    <rect x="96" y="314" width="220" height="236" rx="18" fill="#f4f7f2" stroke="#d5e0d7" stroke-width="2"/>
    <rect x="354" y="314" width="220" height="236" rx="18" fill="#e8f1e5" stroke="#d5e0d7" stroke-width="2"/>
    <rect x="612" y="314" width="220" height="236" rx="18" fill="#f4f7f2" stroke="#d5e0d7" stroke-width="2"/>
    <rect x="870" y="314" width="220" height="236" rx="18" fill="#e8f1e5" stroke="#d5e0d7" stroke-width="2"/>
    <rect x="1128" y="314" width="220" height="236" rx="18" fill="#f4f7f2" stroke="#d5e0d7" stroke-width="2"/>
  </g>
  <g font-family="Arial,sans-serif">
    <text x="122" y="364" fill="#16764f" font-size="14" font-weight="700" letter-spacing="1.3">CONTEXTO</text><text x="122" y="408" fill="#10392c" font-size="23" font-weight="700">Organización</text><text x="122" y="452" fill="#5f7268" font-size="16">A quién pertenecen</text><text x="122" y="478" fill="#5f7268" font-size="16">los datos</text>
    <text x="380" y="364" fill="#16764f" font-size="14" font-weight="700" letter-spacing="1.3">AMBIENTE</text><text x="380" y="408" fill="#10392c" font-size="23" font-weight="700">Entorno</text><text x="380" y="452" fill="#5f7268" font-size="16">Público o espacio</text><text x="380" y="478" fill="#5f7268" font-size="16">autorizado</text>
    <text x="638" y="364" fill="#16764f" font-size="14" font-weight="700" letter-spacing="1.3">HERRAMIENTA</text><text x="638" y="408" fill="#10392c" font-size="23" font-weight="700">Aplicación</text><text x="638" y="452" fill="#5f7268" font-size="16">Módulos y acciones</text><text x="638" y="478" fill="#5f7268" font-size="16">disponibles</text>
    <text x="896" y="364" fill="#16764f" font-size="14" font-weight="700" letter-spacing="1.3">RESPONSABILIDAD</text><text x="896" y="408" fill="#10392c" font-size="23" font-weight="700">Rol</text><text x="896" y="452" fill="#5f7268" font-size="16">Tarea y nivel de</text><text x="896" y="478" fill="#5f7268" font-size="16">responsabilidad</text>
    <text x="1154" y="364" fill="#16764f" font-size="14" font-weight="700" letter-spacing="1.3">ALCANCE</text><text x="1154" y="408" fill="#10392c" font-size="23" font-weight="700">Permiso</text><text x="1154" y="452" fill="#5f7268" font-size="16">Lo que puede ver</text><text x="1154" y="478" fill="#5f7268" font-size="16">o realizar</text>
  </g>
  <g stroke="#77a965" stroke-width="3" fill="none"><path d="M316 432h38M574 432h38M832 432h38M1090 432h38"/><path d="M346 424l8 8-8 8M604 424l8 8-8 8M862 424l8 8-8 8M1120 424l8 8-8 8"/></g>
  <rect x="96" y="614" width="1252" height="138" rx="18" fill="#0d3529"/>
  <text x="138" y="666" fill="#b6e978" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">REGLA DE CLARIDAD</text>
  <text x="138" y="713" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700">Identificar el entorno antes de solicitar o conceder acceso.</text>
  <text x="96" y="808" fill="#66796e" font-family="Arial,sans-serif" font-size="16">El acceso se define según el entorno, la aplicación y las responsabilidades de cada persona.</text>
</svg>
