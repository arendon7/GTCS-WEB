# Import this file as a separate Render Blueprint. It intentionally creates no
# Render database: persistence remains in the private `huella` schema of OPS.
services:
  - type: web
    name: greenatics-huella-staging
    runtime: docker
    plan: free
    rootDir: apps/calcula-tu-huella
    # Docker paths are resolved inside rootDir by Render.
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_SCHEMA
        value: huella
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HTTPS_ONLY
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://greenatics-huella-staging.onrender.com
      - key: GREENATICS_PUBLIC_URL
        value: https://greenatics-circular.arendon.chatgpt.site
      - key: TRUSTED_HOSTS
        value: greenatics-huella-staging.onrender.com,localhost,127.0.0.1
      - key: SEED_DEMO
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: DEPLOYMENT_STRICT
        value: "false"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
