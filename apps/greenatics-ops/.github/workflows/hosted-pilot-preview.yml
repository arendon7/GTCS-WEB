name: hosted-pilot-preview

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview surface to certify
        required: true
        type: choice
        default: public-only
        options:
          - public-only
          - full-ops
      ops_backend_state:
        description: Backend state for full-ops certification
        required: true
        type: choice
        default: steady-state
        options:
          - steady-state
          - prebootstrap

permissions:
  contents: read

concurrency:
  group: greenatics-hosted-pilot-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PILOT_PREVIEW_MODE: ${{ inputs.mode }}
      PILOT_BACKEND_STATE: ${{ inputs.ops_backend_state }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      DEPLOY_GIT_REF: develop

    steps:
      - name: Checkout canonical develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve exact deployment commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "${#sha}" -eq 40
          echo "DEPLOY_GIT_SHA=$sha" >> "$GITHUB_ENV"
          echo "Deploying ${PILOT_PREVIEW_MODE} preview from develop@${sha:0:12}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PILOT_PREVIEW_MODE" = "full-ops" ]; then
            echo "OPS backend state: ${PILOT_BACKEND_STATE}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require Vercel preview secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for the hosted pilot workflow."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Require full OPS backend secrets
        if: ${{ inputs.mode == 'full-ops' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PILOT_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PILOT_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.PILOT_SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured for full-ops preview."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Certify pristine hosted Supabase before first Director bootstrap
        if: ${{ inputs.mode == 'full-ops' && inputs.ops_backend_state == 'prebootstrap' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PILOT_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PILOT_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.PILOT_SUPABASE_SECRET_KEY }}
        run: npm run pilot:backend-preflight -- --plants TAM,YAR --require-no-director

      - name: Certify steady-state hosted Supabase
        if: ${{ inputs.mode == 'full-ops' && inputs.ops_backend_state == 'steady-state' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PILOT_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PILOT_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.PILOT_SUPABASE_SECRET_KEY }}
        run: npm run pilot:backend-preflight -- --plants TAM,YAR

      - name: Create or reuse isolated Vercel project and deploy Preview
        id: deploy
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.mode == 'full-ops' && secrets.PILOT_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.mode == 'full-ops' && secrets.PILOT_SUPABASE_PUBLISHABLE_KEY || '' }}
          SUPABASE_SECRET_KEY: ${{ inputs.mode == 'full-ops' && secrets.PILOT_SUPABASE_SECRET_KEY || '' }}
        run: npm run pilot:vercel-preview

      - name: Certify protected deployed Preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          VERCEL_PROJECT_ID: ${{ steps.deploy.outputs.project_id }}
        run: npm run pilot:vercel-preflight
