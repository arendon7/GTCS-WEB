<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Restablecer contraseña · GREENATICS RED</title><link rel="stylesheet" href="/static/red.css?v=20261013-pmirs-mobile-upload2"></head>
<body class="login-page"><a class="skip-link" href="#main-content">Saltar al contenido principal</a><main class="login-layout invite-layout" id="main-content" tabindex="-1">
  <section class="login-intro"><p class="eyebrow">GREENATICS RED</p><h1>Recuperar<br><span>acceso</span></h1><p>Este enlace solo se puede usar una vez y vence una hora después de su creación.</p></section>
  <section class="login-panel"><p class="eyebrow">{% if account %}{{ account.email }}{% else %}Cuenta GREENATICS RED{% endif %}</p><h2>Crear contraseña nueva</h2>
    {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/password-reset/{{ token }}" class="form-stack">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Contraseña nueva<input type="password" name="password" autocomplete="new-password" minlength="12" maxlength="1024" required><small>Usa entre 12 y 1.024 caracteres.</small></label>
      <label>Repite la contraseña<input type="password" name="confirmation" autocomplete="new-password" minlength="12" maxlength="1024" required></label>
      <button class="button primary full-width" type="submit">Actualizar contraseña</button>
    </form>
  </section>
</main></body></html>
