name: Public Web CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: npm run audit:static
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile visual smoke
        run: npm run test:visual
      - name: Run accessibility gate
        run: npm run test:a11y
      - name: Upload browser QA artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: greenatics-public-web-browser-qa
          path: |
            qa-screenshots/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
