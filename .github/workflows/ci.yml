name: Public Web CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: greenatics-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Public web quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run qa:runtime-config
      - run: npm run build
      - run: npm run audit:static
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Run isolated GREENATICS RED landing check
        run: npm run test:red-landing
      - name: Run desktop and mobile visual smoke
        run: npm run test:visual
      - name: Run accessibility gate
        run: npm run test:a11y
      - name: Upload browser QA artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: greenatics-public-web-browser-qa
          path: |
            qa-screenshots/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  ops-quality:
    name: GREENATICS OPS quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/greenatics-ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('apps/greenatics-ops/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build with reproducible fallback
        run: pnpm exec next build --webpack

  huella-quality:
    name: Calcula tu Huella quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/calcula-tu-huella
    env:
      APP_ENV: test
      SESSION_SECRET: ci-session-secret-only
      DATABASE_URL: sqlite+pysqlite:///./instance/ci.sqlite3
      SEED_DEMO: "true"
      OPEN_BROWSER: "0"
      CSRF_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      DEPLOYMENT_STRICT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/calcula-tu-huella/requirements-dev.txt
      - name: Install locked application dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Python and migrations
        run: |
          python -m compileall -q app scripts tests run.py
          mkdir -p instance
          rm -f instance/ci.sqlite3
          python -m alembic upgrade head
      - name: Run complete Huella regression suite
        run: PYTHONPATH=. python -m pytest -q

  red-quality:
    name: GREENATICS RED quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/greenatics-red
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install RED test dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci
      - name: Run complete RED candidate verification
        run: |
          python -m compileall -q app tests run.py
          python -m pytest -q
          npm test -- --run
          npm run validate:forms

  red-postgres-recovery:
    name: RED PostgreSQL migration and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: red_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d red_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/greenatics-red
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/red_ci
    steps:
      - uses: actions/checkout@v4
      - name: Initialize containers
        run: echo "PostgreSQL 16 ready"
      - name: Check out source
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RED test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Migrate, back up and restore synthetic RED data
        run: python -m pytest -q tests/test_postgres_recovery.py
      - name: Verify temporary schemas were removed
        run: python -m pytest -q tests/test_postgres_recovery.py -k temporary_schema
