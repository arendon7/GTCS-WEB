name: quality

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Canonical project files
        run: |
          test -f PRODUCT.md
          test -f DESIGN.md
          test -f AGENTS.md
          test -f knowledge/memory.jsonl
      - name: Validate JSONL memory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for line in Path('knowledge/memory.jsonl').read_text().splitlines(): json.loads(line)
          print('memory.jsonl OK')
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Static and unit gates
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-1.62.0
      - name: Install Chromium
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Browser gates
        timeout-minutes: 10
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Initialize local Supabase project
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
      - name: Apply migrations on fresh local Supabase
        run: supabase start
      - name: Database RLS and transactional gates
        run: supabase test db
      - name: Postgres lint
        run: supabase db lint --local --level error
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
