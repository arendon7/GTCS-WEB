name: quality

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Canonical project files
        run: |
          test -f PRODUCT.md
          test -f DESIGN.md
          test -f AGENTS.md
          test -f knowledge/memory.jsonl
      - name: Validate JSONL memory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for line in Path('knowledge/memory.jsonl').read_text().splitlines(): json.loads(line)
          print('memory.jsonl OK')
          PY
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Static and unit gates
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser gates
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
