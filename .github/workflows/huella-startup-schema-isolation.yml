name: Huella startup schema isolation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - apps/calcula-tu-huella/start_prod.sh
      - apps/calcula-tu-huella/tests/test_startup_schema_isolation.py
      - .github/workflows/huella-startup-schema-isolation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: huella_startup_ci
          POSTGRES_USER: startup_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U startup_ci -d huella_startup_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/calcula-tu-huella
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-prod.txt
      - name: Verify startup keeps private operational tables out of public
        env:
          HUELLA_TEST_POSTGRES_URL: postgresql+psycopg://startup_ci:disposable-ci-only@127.0.0.1:5432/huella_startup_ci
        run: python -m unittest discover -s tests -p 'test_startup*.py' -v
